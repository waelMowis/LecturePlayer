# فحص إن المشروع بيتبني مع كل push.
# النشر (المثبّت + Release على GitHub) بيتعمل من Visual Studio ببروفايل «GitHub»،
# عشان رقم الإصدار والمثبّت يبقوا هم نفس اللي الأجهزة بتتحدّث منه.
name: build

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: فحص لغة الواجهة (عربية فصحى مبسّطة)
        run: python tools/lint/msa_lint.py

      - name: Build
        run: dotnet build src/LecturePlayer/LecturePlayer.csproj -c Release

      - name: أدوات أردوينو (ذاكرة مؤقتة)
        uses: actions/cache@v4
        with:
          path: Releases/_tools/arduino
          key: arduino-${{ hashFiles('tools/arduino/fetch-arduino.ps1') }}

      - name: أدوات أردوينو (محاكي بدون نت)
        shell: pwsh
        run: ./tools/arduino/fetch-arduino.ps1 -Dest Releases/_tools/arduino -SampleOut smoke-shots/arduino

      - name: فحص إن البرنامج بيفتح (smoke test)
        shell: pwsh
        run: |
          dotnet build src/LecturePlayer/LecturePlayer.csproj -c Release -o smoke
          Copy-Item Releases/_tools/arduino smoke/arduino -Recurse -Force
          $p = Start-Process -FilePath smoke\LecturePlayer.exe -ArgumentList '--smoke-test' -PassThru -RedirectStandardError smoke-err.txt -RedirectStandardOutput smoke-out.txt
          if (-not $p.WaitForExit(1200000)) { $p.Kill(); throw 'البرنامج علّق في فحص الفتح' }
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          Get-ChildItem smoke\Data\logs -ErrorAction SilentlyContinue | Get-Content -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "البرنامج وقع وهو بيفتح (exit $($p.ExitCode))" }

      - name: صور الفحص (للمراجعة)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: smoke-shots
          if-no-files-found: ignore
