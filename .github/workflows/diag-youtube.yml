# تشخيص مؤقت: هل روابط يوتيوب اللي yt-dlp بيرجّعها بتفضل شغالة (لفيديو طويل) وبأنهي صيغة.
name: diag-youtube
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/diag-youtube.yml' ]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: yt-dlp + deno
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile yt-dlp.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath .
          .\yt-dlp.exe --version
      - name: probe
        shell: pwsh
        run: |
          $u = 'https://www.youtube.com/watch?v=BIqnMZFnd8I'
          function Probe($label, $fargs) {
            Write-Host "===== $label"
            $json = & .\yt-dlp.exe -j --no-playlist @fargs $u 2>err.txt
            Get-Content err.txt | Select-Object -Last 5
            if (-not $json) { Write-Host "NO JSON"; return }
            $o = $json | ConvertFrom-Json
            $fmts = if ($o.requested_formats) { $o.requested_formats } else { @($o) }
            foreach ($f in $fmts) {
              $url = $f.url
              Write-Host ("fmt {0} proto={1} vcodec={2} acodec={3} h={4} filesize={5}" -f $f.format_id,$f.protocol,$f.vcodec,$f.acodec,$f.height,$f.filesize)
              $ua = $o.http_headers.'User-Agent'
              foreach ($range in @('bytes=0-100000','bytes=50000000-50100000','bytes=500000000-500100000')) {
                try {
                  $r = Invoke-WebRequest -Uri $url -Headers @{ Range=$range; 'User-Agent'=$ua } -UseBasicParsing -TimeoutSec 20
                  Write-Host "  $range -> $($r.StatusCode) len=$($r.RawContentLength)"
                } catch { Write-Host "  $range -> ERR $($_.Exception.Response.StatusCode.value__) $($_.Exception.Message)" }
                if ($f.protocol -like 'm3u8*') { break }
              }
            }
          }
          Probe 'best bv*+ba/b h264' @('-f','bv*+ba/b','-S','res:1080,proto,vcodec:h264,acodec:m4a')
          Probe 'muxed b' @('-f','b/bv*+ba','-S','res:1080,proto,vcodec:h264,acodec:m4a')
          Probe 'hls pref' @('-f','b/bv*+ba','-S','proto:m3u8,res:720')
          Probe 'client tv' @('--extractor-args','youtube:player_client=tv','-f','b/bv*+ba','-S','res:720,proto')
          Probe 'client ios hls' @('--extractor-args','youtube:player_client=ios','-f','b/bv*+ba','-S','proto:m3u8,res:720')
          Probe 'client web_safari hls' @('--extractor-args','youtube:player_client=web_safari','-f','b/bv*+ba','-S','proto:m3u8,res:720')
          & .\yt-dlp.exe -F --no-playlist $u 2>&1 | Select-Object -Last 40
