<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قارئ مسار</title>
<link rel="stylesheet" href="lib/pdf_viewer.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="ink.css">
<script>
  // أي خطأ قبل ما القارئ يشتغل يتسجّل في سجل البرنامج
  window.addEventListener("error", e => { try { chrome.webview.postMessage(JSON.stringify({ t: "log", message: "early error: " + e.message + " @" + e.filename + ":" + e.lineno })); } catch (x) { } });
</script>
</head>
<body class="empty">
<div id="toolbar" role="toolbar">
  <div class="group title"><span id="bookTitle"></span></div>
  <div class="group pages">
    <button id="prev" dir="ltr" title="الصفحة اللي قبلها">›</button>
    <input id="pageInput" type="text" inputmode="numeric" title="رقم الصفحة (Ctrl+G)" autocomplete="off">
    <span class="of">/ <span id="pageCount">0</span></span>
    <button id="next" dir="ltr" title="الصفحة اللي بعدها">‹</button>
  </div>
  <div class="group tools">
    <button id="zoomOut" title="تصغير (Ctrl+-)">−</button>
    <select id="zoomSelect" title="التكبير">
      <option value="page-width">عرض الصفحة</option>
      <option value="page-fit">الصفحة كاملة</option>
      <option value="auto">تلقائي</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="3">300%</option>
      <option value="custom" hidden></option>
    </select>
    <button id="zoomIn" title="تكبير (Ctrl+=)">+</button>
    <span class="sep"></span>
    <button id="spread" title="صفحة ولا صفحتين جنب بعض">▯</button>
    <button id="direction" title="اتجاه الصفحات (كتاب عربي: من اليمين للشمال)">⇄</button>
    <button id="theme" title="لون الصفحات: عادي ← ليلي ← ورق قديم">☀</button>
    <button id="findButton" title="بحث في الكتاب (Ctrl+F)">🔍</button>
    <button id="mark" title="علامة على الصفحة دي (B)">🔖</button>
    <button id="inkBtn" title="أدوات الشرح: أقلام وألوان وممحاة وأشكال ونص وملصقات (Ctrl+Shift+D)">🖊</button>
    <button id="ai" title="الذكاء الاصطناعي: اشرحلي الصفحة، لخّص الفصل، اختبرني">✨</button>
    <button id="fullscreen" title="ملء الشاشة (F11)">⛶</button>
  </div>
</div>
<div id="findbar" hidden>
  <input id="findInput" type="search" placeholder="دوّر في الكتاب…" autocomplete="off">
  <button id="findPrev" title="اللي قبله (Shift+Enter)">˄</button>
  <button id="findNext" title="اللي بعده (Enter)">˅</button>
  <span id="findResult"></span>
  <button id="findClose" title="قفل (Esc)">✕</button>
</div>
<div id="viewerContainer" tabindex="0">
  <div id="viewer" class="pdfViewer"></div>
</div>
<div id="epubArea" hidden></div>
<div id="hlbar" hidden>
  <button data-color="yellow" title="ظلّل أصفر" class="sw" style="--c:#ffe066"></button>
  <button data-color="green" title="ظلّل أخضر" class="sw" style="--c:#8ce99a"></button>
  <button data-color="blue" title="ظلّل أزرق" class="sw" style="--c:#74c0fc"></button>
  <button data-color="pink" title="ظلّل وردي" class="sw" style="--c:#faa2c1"></button>
  <button id="hlNote" title="ظلّل واكتب ملاحظة">📝</button>
  <button id="hlDelete" title="شيل التظليل" hidden>🗑</button>
</div>
<div id="overlay"><div id="overlayText">افتح كتاب من «الكتب»</div></div>
<script src="lib/pdf.min.js" type="module"></script>
<script src="lib/pdf_viewer.js" type="module"></script>
<script src="reader.js" type="module"></script>
</body>
</html>
